[project]
name = "bimax-simulation"
version = "0.1.0"
description = "Binary-volume jaw movement simulator for Linux"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<2.5",
  "scipy>=1.15,<2",
  "scikit-image>=0.25,<0.27",
  "SimpleITK==2.5.5",
  "PySide6-Essentials==6.11.2",
  "vtk==9.7.0",
  "psutil>=7,<8",
]

[project.scripts]
bimax = "bimax.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bimax"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "mypy>=1.15"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
