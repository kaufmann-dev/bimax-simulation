[project]
name = "bimax-simulation"
version = "0.2.0"
description = "Binary-volume jaw movement simulator for Linux"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.5,<2.6",
  "scipy>=1.18,<2",
  "scikit-image>=0.26,<0.27",
  "SimpleITK==2.5.7",
  "PySide6-Essentials==6.12.0",
  "vtk==9.7.2",
  "psutil>=7.2,<8",
  "mcp==2.3.0",
]

[project.scripts]
bimax = "bimax.app:main"
bimax-mcp = "bimax.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bimax"]

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17", "mypy>=2.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
